<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="FitTrack — organize seus treinos, exercícios e dietas em um só lugar."
    />
    <meta name="theme-color" content="#080b09" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FitTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FitTrack — Treino &amp; Nutrição</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fittrack:theme') || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#080b09' : '#f4f6f0')
        } catch (error) {
          /* localStorage may be unavailable; ThemeProvider resolves at runtime */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
